# Runs when you push a tag like v1.0.0. Builds USN for each OS and attaches the
# downloads to a GitHub Release.
name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      - name: Build with PyInstaller
        run: pyinstaller --noconfirm usn.spec

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: Compress-Archive -Path dist/USN -DestinationPath USN-windows.zip

      - name: Package (macOS)
        if: runner.os == 'macOS'
        run: cd dist && zip -r ../USN-macos.zip USN

      - name: Package (Linux)
        if: runner.os == 'Linux'
        run: cd dist && tar -czf ../USN-linux.tar.gz USN

      - name: Upload to release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            USN-*.zip
            USN-*.tar.gz
          generate_release_notes: true
